
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日本麵包超人博物館GPS位置回報</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body {
      font-family: 'Noto Sans TC', 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 15% 15%, #FFFDF0 0%, #FEF3C7 50%, #FDE68A 100%);
    }
    @keyframes spin-custom {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-custom 0.8s linear infinite;
    }
    .comic-card {
      box-shadow: 0 10px 25px -4px rgba(220, 38, 38, 0.15), 0 6px 12px -2px rgba(180, 83, 9, 0.1);
    }
    .comic-btn-shadow {
      box-shadow: 0 5px 0 #881337;
    }
    .comic-btn-shadow:active {
      transform: translateY(2px);
      box-shadow: 0 3px 0 #881337;
    }
    .comic-btn-shadow:disabled {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="text-amber-950 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 selection:bg-amber-200 selection:text-red-700">
  <!-- 主容器卡片 -->
  <main class="w-full max-w-md bg-white rounded-3xl comic-card border-4 border-amber-300 overflow-hidden transition-all duration-300 my-4">
    
    <!-- 頂部 Header Banner -->
    <header class="relative bg-amber-100/70 border-b-4 border-amber-300 overflow-hidden">
      <div class="w-full bg-[#fceecf] flex items-center justify-center overflow-hidden">
        <img id="bannerImg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxFRpPpKoLFkn7fsVvAkI3r0I3bTMlAvD6ao615VajdBYu49zCh_D2mUz17xNw2YAHuIZHaq2VgmlbPsT8lokMUVvkh4CrhH0eFt-ULrOlMaWkPOUr4xFUmuqaF7nzijHGoHqhqdQbuXKqkR4cMPDOMucCAfBs53O7Ryek_jc1g2Bc9PzXrUh114_y772CGsPNLEAjcN_SkKMb6Wo3TX25ux9af2Kvjdmh1s-Oao4zidDuDn5lJZ9rb0QbOylYgjlcLUQ" alt="日本麵包超人博物館GPS位置回報" class="w-full h-auto block object-contain aspect-[1024/765] max-h-72 sm:max-h-80 transition-all duration-300">
      </div>
      <!-- 標題 -->
      <div class="px-5 py-3 text-center bg-gradient-to-b from-amber-50 to-orange-50/80">
        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-red-500 text-white text-xs font-bold tracking-wider shadow-sm mb-1">
          <span>✨</span>
          <span>ANPANMAN GPS STATION</span>
          <span>✨</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-red-600 tracking-tight flex items-center justify-center gap-1.5">
          <span>📍</span>
          <span>日本麵包超人博物館GPS位置回報</span>
        </h1>
      </div>
    </header>

    <div class="p-5 sm:p-6 space-y-4">
      <!-- 輸入表單 -->
      <form id="reportForm" class="space-y-4" onsubmit="return false;" novalidate>
        
        <!-- 團隊編號 (必填) -->
        <div>
          <label for="teamCode" class="block text-sm font-bold text-amber-950 mb-1 flex items-center justify-between">
            <span class="flex items-center gap-1">
              <span class="text-red-500">🚩</span> 團隊編號
              <span class="text-red-500 font-bold">*</span>
            </span>
            <span class="text-[11px] font-normal text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">必填欄位</span>
          </label>
          <div class="relative">
            <input type="text" id="teamCode" placeholder="請輸入隊伍代號（例：B01）" required class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400">
          </div>
          <p id="teamCodeError" class="hidden text-red-600 text-xs mt-1.5 font-bold flex items-center gap-1">
            <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            請輸入團隊編號以利辨識回報來源！
          </p>
        </div>

        <!-- 姓名 / 暱稱 (選填) -->
        <div>
          <label for="userName" class="block text-sm font-bold text-amber-950 mb-1 flex items-center gap-1">
            <span class="text-amber-600">👤</span> 隊員姓名 / 暱稱
            <span class="text-xs font-normal text-amber-600">(選填)</span>
          </label>
          <input type="text" id="userName" placeholder="請輸入你的名字（例：小貓咪）" class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400">
        </div>

        <!-- 需求1：裝置碼顯示放在最下面(在取得位置送出按鍵前) -->
        <section aria-label="裝置識別" class="bg-amber-50/90 rounded-2xl p-2.5 flex items-center justify-between gap-2 text-xs border border-amber-200">
          <div class="flex items-center gap-2 min-w-0">
            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-amber-400 text-white font-bold text-[10px] shrink-0 shadow-inner">ID</span>
            <span class="text-amber-900 font-bold shrink-0">裝置識別碼:</span>
            <span id="uuidDisplay" class="font-mono text-amber-800 text-[11px] truncate" title="裝置 UUID">載入中...</span>
          </div>
          <button id="copyUuidBtn" type="button" class="px-2 py-1 bg-amber-200 hover:bg-amber-300 text-amber-950 font-bold rounded-lg text-xs shrink-0 active:scale-95 transition-all flex items-center gap-1 border border-amber-300" title="複製 UUID">
            <span>複製</span>
          </button>
        </section>

        <!-- 需求3：將按鍵改名為「送出取得位置」 -->
        <button type="button" id="submitBtn" class="w-full py-3.5 px-5 bg-[#a31515] hover:bg-[#8e1212] active:bg-[#771010] text-white font-bold text-base rounded-2xl comic-btn-shadow transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          <!-- 旋轉 Loading -->
          <svg id="btnSpinner" class="hidden w-5 h-5 shrink-0 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-30" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span id="btnText">送出取得位置</span>
        </button>

        <!-- 需求8：查看隊員位置按鈕 -->
        <button type="button" id="viewMapBtn" class="w-full py-2.5 px-4 bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-sm rounded-xl border border-amber-300 transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-[0.99]">
          <span>🗺️</span>
          <span>查看隊員位置地圖</span>
        </button>
      </form>

      <!-- 需求4：打卡成功資訊卡片 (按鍵下方動態呈現，參考圖示綠底簡約質感) -->
      <section id="checkinSuccessCard" class="hidden bg-[#eaf4ec] border border-[#d2e8d6] rounded-2xl p-4 text-[#244b28] space-y-2 transition-all">
        <div class="flex items-center gap-2 text-base font-bold text-[#1b7e33]">
          <span class="inline-flex items-center justify-center w-5 h-5 bg-[#22c55e] text-white rounded text-xs font-black">✓</span>
          <span>打卡成功！</span>
        </div>
        
        <div class="text-[13px] space-y-1.5 font-medium text-[#2d4b31] leading-relaxed">
          <div><span class="font-bold">團隊：</span><span id="cardTeam"></span></div>
          <div><span class="font-bold">姓名：</span><span id="cardName"></span></div>
          <div><span class="font-bold">時間：</span><span id="cardTime" class="font-mono"></span></div>
          <div>
            <span class="font-bold">位置：</span>
            <span id="cardLocation" class="font-mono"></span>
            <span id="cardAccuracy" class="text-xs text-emerald-800"></span>
          </div>
          <div class="pt-1">
            <a id="cardMapLink" href="#" target="_blank" rel="noopener noreferrer" class="text-[#2b6cb0] hover:text-[#1a4473] underline font-bold inline-flex items-center gap-1">
              在 Google 地圖查看 ↗
            </a>
          </div>
        </div>

        <!-- 本裝置歷史打卡紀錄 -->
        <div class="mt-3 pt-3 border-t border-emerald-200/60 text-xs">
          <p class="font-bold text-gray-600 mb-1">這台裝置的打卡紀錄</p>
          <div class="flex items-center justify-between text-gray-700">
            <span id="lastRecordDesc">-</span>
            <span id="lastRecordTime" class="font-mono">-</span>
          </div>
        </div>
      </section>

      <!-- 錯誤狀態提示 -->
      <section id="errorCard" class="hidden rounded-xl bg-red-50 border border-red-200 p-3 text-red-800 text-xs font-medium"></section>
    </div>

    <!-- 頁尾 -->
    <footer class="px-5 py-3 bg-amber-100/60 border-t-2 border-amber-200 text-center text-[11px] text-amber-800 font-medium flex items-center justify-center gap-1.5">
      <span>🍪</span>
      <span>請開啟手機 GPS 與瀏覽器位置存取授權</span>
      <span>🍪</span>
    </footer>
  </main>

  <!-- 需求8：隊員位置地圖 Modal 視窗 -->
  <div id="mapModal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col items-center justify-center p-3">
    <div class="bg-white rounded-2xl w-full max-w-lg h-[80vh] flex flex-col overflow-hidden shadow-2xl border-4 border-amber-300">
      <div class="p-3 bg-amber-100 border-b border-amber-300 flex items-center justify-between">
        <h3 class="font-black text-amber-900 text-sm flex items-center gap-1">
          <span>🚩</span> 隊員分佈地圖 (Google Sheets 即時匯入)
        </h3>
        <button id="closeMapBtn" class="text-amber-900 hover:bg-amber-200 rounded-lg p-1 text-base font-bold">✕</button>
      </div>
      <!-- 地圖容器 -->
      <div id="map" class="flex-1 w-full bg-slate-100"></div>
      <div class="p-2.5 bg-amber-50 text-[11px] text-amber-800 text-center border-t border-amber-200">
        💡 點擊圖標可查看隊員編號、姓名與回報時間
      </div>
    </div>
  </div>

  <!-- 浮動 Toast -->
  <div id="toast" class="fixed bottom-5 bg-amber-900 text-amber-50 px-4 py-2 rounded-xl text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 border border-amber-700 z-50">
    已成功複製！
  </div>

  <!-- Leaflet JS for Map -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>

      // 需求2 & 7：後端 GAS API 網址直接在後端運作，不呈現於介面
      const API_URL = "https://script.google.com/macros/s/AKfycbz3ged0fEcHdWhoRtsT-tGgmqbXc1Ki7cn-B-oLFZJXX4g-kmcG39zniB9qyzt1Gw-X/exec";
      const STORAGE_KEY_UUID = 'gps_reporter_device_uuid';
