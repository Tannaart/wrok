<!DOCTYPE html>

<html lang="zh-Hant"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>麵包超人 GPS 定位回報站</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Google Fonts: Noto Sans TC & Fredoka (卡通活潑圓角風格) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style>
    body {
      font-family: 'Noto Sans TC', 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 15% 15%, #FFFDF0 0%, #FEF3C7 50%, #FDE68A 100%);
    }
    /* 旋轉動畫 */
    @keyframes spin-custom {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-custom 0.8s linear infinite;
    }
    /* 卡通彈跳與陰影特效 */
    .comic-card {
      box-shadow: 0 10px 25px -4px rgba(220, 38, 38, 0.15), 0 6px 12px -2px rgba(180, 83, 9, 0.1);
    }
    .comic-btn-shadow {
      box-shadow: 0 6px 0 #991b1b, 0 10px 15px -3px rgba(220, 38, 38, 0.4);
    }
    .comic-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #991b1b, 0 5px 8px -2px rgba(220, 38, 38, 0.4);
    }
    .comic-btn-shadow:disabled {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="text-amber-950 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 selection:bg-amber-200 selection:text-red-700">
<!-- 主容器卡片 -->
<main class="w-full max-w-md bg-white rounded-3xl comic-card border-4 border-amber-300 overflow-hidden transition-all duration-300 my-4">
<!-- 頂部 Header Banner (完整顯示橫式貼圖，不切角) -->

<!-- 麵包超人主題貼圖 -->
<div class="w-full bg-[#fceecf] flex items-center justify-center overflow-hidden">
<img alt="麵包超人 GPS 定位探索回報" class="w-full h-auto block object-contain aspect-[1024/765] max-h-72 sm:max-h-80 transition-all duration-300" id="bannerImg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBxFRpPpKoLFkn7fsVvAkI3r0I3bTMlAvD6ao615VajdBYu49zCh_D2mUz17xNw2YAHuIZHaq2VgmlbPsT8lokMUVvkh4CrhH0eFt-ULrOlMaWkPOUr4xFUmuqaF7nzijHGoHqhqdQbuXKqkR4cMPDOMucCAfBs53O7Ryek_jc1g2Bc9PzXrUh114_y772CGsPNLEAjcN_SkKMb6Wo3TX25ux9af2Kvjdmh1s-Oao4zidDuDn5lJZ9rb0QbOylYgjlcLUQ"/>
</div>
<!-- 標題與活潑副標 -->
<div class="px-5 py-3 text-center bg-gradient-to-b from-amber-50 to-orange-50/80">
<div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-red-500 text-white text-xs font-bold tracking-wider shadow-sm mb-1">
<span>✨</span>
<span>ANPANMAN GPS STATION</span>
<span>✨</span>
</div>
<h1 class="text-xl sm:text-2xl font-black text-red-600 tracking-tight flex items-center justify-center gap-1.5">
<span>📍</span>
<span>日本麵包超人博物館GPS位置回報</span>
</h1>
<p class="text-xs text-amber-800 font-medium mt-0.5">填寫團隊編號姓名，送出按鈕，就會把你現在的位置送到雲端打卡表。</p>

</header>
<div class="p-5 sm:p-6 space-y-4">
<!-- 輸入表單 -->
<form class="space-y-4" id="reportForm" novalidate="" onsubmit="return false;">
<!-- 團隊編號 (必填) -->
<div>
<label class="block text-sm font-bold text-amber-950 mb-1 flex items-center justify-between" for="teamCode">
<span class="flex items-center gap-1">
<span class="text-red-500">🚩</span> 團隊編號
              <span class="text-red-500 font-bold">*</span>
</span>
<span class="text-[11px] font-normal text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">必填欄位</span>
</label>
<div class="relative">
<input class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400" id="teamCode" placeholder="請輸入隊伍代號（例：B01）" required="" type="text"/>
</div>
<p class="hidden text-red-600 text-xs mt-1.5 font-bold flex items-center gap-1" id="teamCodeError">
<svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" fill-rule="evenodd"></path>
</svg>
            請輸入團隊編號以利辨識回報來源！
          </p>
</div>
<!-- 姓名 / 暱稱 (選填) -->
<div>
<label class="block text-sm font-bold text-amber-950 mb-1 flex items-center gap-1" for="userName">
<span class="text-amber-600">👤</span> 姓名 / 暱稱
            <span class="text-xs font-normal text-stone-500">(選填)</span>
</label>
<input class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400" id="userName" placeholder="請輸入你的名字（例：小貓咪）" type="text"/>
</div>
<!-- 後端 Web App URL (折疊式設定) -->
<details class="group rounded-2xl bg-amber-50/60 p-3 text-xs transition-colors">
<summary class="font-bold text-amber-900 cursor-pointer flex items-center justify-between select-none">
<span class="flex items-center gap-1.5">
<span>⚙️</span>
              後端設定：Google Apps Script API
            </span>
<svg class="w-3.5 h-3.5 text-amber-600 transform group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</summary>
<div class="mt-2.5 pt-2">
<input class="w-full px-3 py-1.5 font-mono text-amber-950 bg-white border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 text-xs" id="apiUrl" placeholder="https://script.google.com/macros/s/AKfycbx69v61qmlTP3fe-KfcX6FQSnwis9lrp8J8G6_RDwipVI2XOr_MV0k3SZQ9YL38OReEfQ/exec" type="url" value="https://script.google.com/macros/s/AKfycbx69v61qmlTP3fe-KfcX6FQSnwis9lrp8J8G6_RDwipVI2XOr_MV0k3SZQ9YL38OReEfQ/exec"/>
<p class="text-amber-700 mt-1.5 text-[11px] leading-relaxed">
              Google Apps Script 雲端回傳 API 網址（已設定完成）。
            </p>
</div>
</details>
<!-- 動作按鈕 (麵包超人亮紅 + 鮮黃撞色活力風格) -->
<button class="w-full py-3.5 px-5 bg-gradient-to-r from-red-500 via-red-600 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-black text-base rounded-2xl comic-btn-shadow transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed border-2 border-red-700" id="submitBtn" type="button">
<!-- 麵包超人風格圓形圖示 -->
<span class="text-xl shrink-0" id="btnIconEmoji">🍞</span>
<!-- 按鈕 Loading Spinner -->
<svg class="hidden w-5 h-5 shrink-0 animate-spin-custom text-white" fill="none" id="btnSpinner" viewbox="0 0 24 24">
<circle class="opacity-30" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-90" d="M4 12a8 8 0 018-8v8H4z" fill="currentColor"></path>
</svg>
<span id="btnText">取得位置並送出</span>
</button>
</form>
<!-- 錯誤/進行中 狀態卡片 (若有非成功狀態時顯示) -->
<section aria-live="polite" class="hidden rounded-2xl border-2 p-4 transition-all duration-300" id="statusCard">
<div class="flex items-start gap-3">
<div class="shrink-0 text-2xl mt-0.5" id="statusIconWrapper"></div>
<div class="flex-1 min-w-0">
<h3 class="text-sm font-black" id="statusTitle"></h3>
<p class="text-xs mt-0.5 break-words font-medium" id="statusDesc"></p>
</div>
</div>
</section>
<!-- 成功回報結果卡片 (預設隱藏，回報成功才顯示) -->
<section aria-live="polite" class="hidden bg-[#eaf7ee] rounded-2xl p-4 sm:p-5 text-neutral-800 transition-all duration-300 text-sm leading-relaxed border border-emerald-200/60 shadow-sm" id="successCard">
<div class="flex items-center gap-1.5 font-bold text-base text-neutral-900 mb-2">
<span>✅</span>
<span>打卡成功！</span>
</div>
<div class="space-y-1 font-normal text-stone-800">
<div>團隊：<span class="font-medium text-stone-900" id="successTeam"></span></div>
<div>姓名：<span class="font-medium text-stone-900" id="successName"></span></div>
<div>時間：<span class="font-medium text-stone-900" id="successTime"></span></div>
<div>位置：<span class="font-medium text-stone-900" id="successCoord"></span>（誤差約 <span id="successAccuracy"></span> 公尺）</div>
</div>
<div class="mt-2.5">
<a class="text-emerald-700 hover:text-emerald-900 underline font-medium inline-flex items-center gap-1 transition-colors" href="#" id="successMapLink" rel="noopener noreferrer" target="_blank">
            在 Google 地圖查看
          </a>
</div>
</section>
<!-- 這台裝置的打卡紀錄 (比照截圖下半部) -->
<section class="pt-2 text-stone-600 text-xs">
<h4 class="text-[13px] text-stone-500 font-normal mb-2.5 tracking-tight">這台裝置的打卡紀錄</h4>
<!-- 歷史清單容器 -->
<div class="space-y-2 text-stone-800" id="historyList">
<div class="py-2 text-stone-400 text-center border-t border-dashed border-stone-200">尚無打卡紀錄</div>
</div>
<!-- 最底部裝置識別碼 -->
<div class="mt-4 pt-3 border-t border-stone-200/60 flex items-center justify-between gap-2 text-[11px] text-stone-500">
<div class="min-w-0 truncate">
<span>裝置識別碼：</span><span class="font-mono text-stone-600" id="uuidDisplay">載入中...</span>
</div>
<button class="shrink-0 p-1 hover:text-stone-800 active:scale-95 transition-all" id="copyUuidBtn" title="複製 UUID" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</section>
</div>
<!-- 頁尾說明 -->
<footer class="px-5 py-3 bg-amber-100/60 border-t-2 border-amber-200 text-center text-[11px] text-amber-800 font-medium flex items-center justify-center gap-1.5">
<span>🍪</span>
<span>請開啟手機 GPS 與瀏覽器位置存取授權</span>
<span>🍪</span>
</footer>
</main>
<!-- 浮動 Toast 提示 -->
<div class="fixed bottom-5 bg-amber-900 text-amber-50 px-4 py-2 rounded-xl text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 border border-amber-700 z-50" id="toast">
    已成功複製！
  </div>
<script>
    /**
     * GPS 回報前端邏輯模組
     */
    (function () {
      // 快取 DOM 元素
      const teamCodeInput = document.getElementById('teamCode');
      const teamCodeError = document.getElementById('teamCodeError');
      const userNameInput = document.getElementById('userName');
      const apiUrlInput = document.getElementById('apiUrl');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIconEmoji = document.getElementById('btnIconEmoji');
      const btnSpinner = document.getElementById('btnSpinner');
      const uuidDisplay = document.getElementById('uuidDisplay');
      const copyUuidBtn = document.getElementById('copyUuidBtn');
      const statusCard = document.getElementById('statusCard');
      const statusIconWrapper = document.getElementById('statusIconWrapper');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');

      // 截圖樣式打卡成功面板元素
      const successCard = document.getElementById('successCard');
      const successTeam = document.getElementById('successTeam');
      const successName = document.getElementById('successName');
      const successTime = document.getElementById('successTime');
      const successCoord = document.getElementById('successCoord');
      const successAccuracy = document.getElementById('successAccuracy');
      const successMapLink = document.getElementById('successMapLink');
      const historyList = document.getElementById('historyList');

      const toast = document.getElementById('toast');
      const STORAGE_KEY_UUID = 'gps_reporter_device_uuid';
      const STORAGE_KEY_HISTORY = 'gps_checkin_history_v1';

      /**
       * 1. 取得或產生唯一的裝置 UUID 並儲存
       */
      function initDeviceUUID() {
        let uuid = localStorage.getItem(STORAGE_KEY_UUID);
        if (!uuid) {
          if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
            uuid = crypto.randomUUID();
          } else {
            uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              const r = Math.random() * 16 | 0;
              const v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          }
          localStorage.setItem(STORAGE_KEY_UUID, uuid);
        }
        uuidDisplay.textContent = uuid;
        uuidDisplay.title = uuid;
        return uuid;
      }

      /**
       * 2. 取得 Asia/Taipei 時區格式化時間 (YYYY/MM/DD HH:MM)
       */
      function getTaipeiTimestamp() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('zh-TW', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(now);
        const map = {};
        parts.forEach(({ type, value }) => {
          map[type] = value;
        });
        const year = map.year;
        const month = map.month.padStart(2, '0');
        const day = map.day.padStart(2, '0');
        const hour = map.hour.padStart(2, '0');
        const minute = map.minute.padStart(2, '0');
        return `${year}/${month}/${day} ${hour}:${minute}`;
      }

      /**
       * 3. 讀取並渲染歷史紀錄 (真實紀錄，無紀錄時顯示尚無紀錄)
       */
      function getStoredHistory() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY_HISTORY);
          if (raw) {
            return JSON.parse(raw);
          }
        } catch (e) {
          console.error('Failed to parse history', e);
        }
        return [];
      }

      function saveHistoryItem(item) {
        let history = getStoredHistory();
        history.unshift(item);
        if (history.length > 20) {
          history = history.slice(0, 20);
        }
        try {
          localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
        } catch (e) {
          console.error('Failed to save history', e);
        }
        renderHistory();
      }

      function renderHistory() {
        const list = getStoredHistory();
        if (!list || list.length === 0) {
          historyList.innerHTML = '<div class="py-2 text-stone-400 text-center border-t border-dashed border-stone-200">尚無打卡紀錄</div>';
          return;
        }
        historyList.innerHTML = list.map(item => {
          const displayName = item.name ? `${item.team}・${item.name}` : `${item.team}`;
          return `
            <div class="flex items-center justify-between py-1.5 border-t border-dashed border-stone-300/80 text-xs">
              <span class="font-normal text-stone-900 truncate pr-2">${displayName}</span>
              <span class="text-stone-500 font-mono text-[11px] shrink-0">${item.time}</span>
            </div>
          `;
        }).join('');
      }

      /**
       * 4. 顯示自訂浮動提示 (Toast)
       */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2000);
      }

      /**
       * 5. 複製 UUID 到剪貼簿
       */
      copyUuidBtn.addEventListener('click', () => {
        const textToCopy = uuidDisplay.textContent;
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('✅ 裝置識別碼已複製！');
        } catch (err) {
          showToast('無法複製，請手動複製');
        } finally {
          document.body.removeChild(textarea);
        }
      });

      /**
       * 6. 按鈕讀取中狀態切換
       */
      function setButtonState(isLoading, text = '取得位置並送出', emoji = '🍞') {
        if (isLoading) {
          submitBtn.disabled = true;
          btnSpinner.classList.remove('hidden');
          btnIconEmoji.classList.add('hidden');
          btnText.textContent = text;
        } else {
          submitBtn.disabled = false;
          btnSpinner.classList.add('hidden');
          btnIconEmoji.classList.remove('hidden');
          btnIconEmoji.textContent = emoji;
          btnText.textContent = text;
        }
      }

      /**
       * 7. 顯示非成功的過渡或錯誤訊息
       */
      function renderInfoOrError({ type, title, message }) {
        statusCard.classList.remove('hidden');
        statusCard.className = 'rounded-2xl border-2 p-4 transition-all duration-300';
        if (type === 'error') {
          statusCard.classList.add('bg-red-50/90', 'border-red-300', 'text-red-950');
          statusIconWrapper.textContent = '⚠️';
        } else if (type === 'info') {
          statusCard.classList.add('bg-amber-50/90', 'border-amber-300', 'text-amber-950');
          statusIconWrapper.textContent = '📡';
        }
        statusTitle.textContent = title;
        statusDesc.textContent = message;
      }

      /**
       * 8. 呼叫瀏覽器 Geolocation API
       */
      function getCurrentCoordinates() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('此瀏覽器不支援 Geolocation 定位功能！'));
            return;
          }
          const options = {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
          };
          navigator.geolocation.getCurrentPosition(
            (position) => resolve(position.coords),
            (err) => {
              let errorMsg = '無法取得位置資訊';
              switch (err.code) {
                case err.PERMISSION_DENIED:
                  errorMsg = '定位權限已被拒絕，請在手機/瀏覽器設定中允許取用位置。';
                  break;
                case err.POSITION_UNAVAILABLE:
                  errorMsg = '無法偵測到位置，請開啟裝置的 GPS 定位服務。';
                  break;
                case err.TIMEOUT:
                  errorMsg = 'GPS 定位超時，請到戶外開闊處重新嘗試。';
                  break;
                default:
                  errorMsg = `定位錯誤：${err.message}`;
              }
              reject(new Error(errorMsg));
            },
            options
          );
        });
      }

      /**
       * 9. 執行回報流程
       */
      async function handleLocationSubmit() {
        const teamCode = teamCodeInput.value.trim();
        if (!teamCode) {
          teamCodeError.classList.remove('hidden');
          teamCodeInput.focus();
          return;
        }
        teamCodeError.classList.add('hidden');
        const userName = userNameInput.value.trim();
        const apiUrl = apiUrlInput.value.trim();
        const uuid = localStorage.getItem(STORAGE_KEY_UUID) || initDeviceUUID();

        if (!apiUrl) {
          renderInfoOrError({
            type: 'error',
            title: '未設定 API 網址',
            message: '請展開上方「後端設定」並輸入有效的 Google Apps Script 部署 URL。'
          });
          return;
        }

        try {
          // 步驟 1: 定位中
          setButtonState(true, 'GPS 搜尋定位中...');
          renderInfoOrError({
            type: 'info',
            title: '正在偵測座標',
            message: '麵包超人衛星正在接收 GPS 訊號，請稍候...'
          });

          const coords = await getCurrentCoordinates();
          const latitude = Number(coords.latitude.toFixed(6));
          const longitude = Number(coords.longitude.toFixed(6));
          const accuracy = Math.round(coords.accuracy || 20);
          const timestamp = getTaipeiTimestamp();

          // 步驟 2: 發送資料
          setButtonState(true, '座標傳送中...');
          const payload = {
            teamCode: teamCode,
            uuid: uuid,
            name: userName,
            latitude: latitude,
            longitude: longitude,
            accuracy: accuracy,
            timestamp: timestamp
          };

          // 以 mode: 'no-cors' 送往 Google Apps Script
          await fetch(apiUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          });

          // 步驟 3: 回報成功，更新綠色打卡成功面板並顯示
          statusCard.classList.add('hidden');
          successTeam.textContent = teamCode;
          successName.textContent = userName || '無';
          successTime.textContent = timestamp;
          successCoord.textContent = `${latitude}, ${longitude}`;
          successAccuracy.textContent = accuracy;
          successMapLink.href = `https://www.google.com/maps?q=${latitude},${longitude}`;
          successCard.classList.remove('hidden');

          // 儲存至歷史紀錄並重新渲染
          saveHistoryItem({
            team: teamCode,
            name: userName,
            time: timestamp
          });

          setButtonState(false, '取得位置並送出', '🍞');
        } catch (error) {
          console.error('[Report Error]', error);
          setButtonState(false, '重新嘗試回報', '🔄');
          renderInfoOrError({
            type: 'error',
            title: '回報失敗',
            message: error.message || '發生連線錯誤，請確認網路與 GPS 是否正常。'
          });
        }
      }

      // 輸入時隱藏錯誤提示
      teamCodeInput.addEventListener('input', () => {
        if (teamCodeInput.value.trim()) {
          teamCodeError.classList.add('hidden');
        }
      });

      // 監聽按鈕點擊
      submitBtn.addEventListener('click', handleLocationSubmit);

      // 初始化裝置識別碼與歷史紀錄
      initDeviceUUID();
      renderHistory();
    })();
  </script>
</body></html>
