<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麵包超人 GPS 定位回報站</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Sans TC & Fredoka (卡通活潑圓角風格) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans TC', 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 15% 15%, #FFFDF0 0%, #FEF3C7 50%, #FDE68A 100%);
    }

    /* 旋轉動畫 */
    @keyframes spin-custom {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin-custom 0.8s linear infinite;
    }

    /* 卡通彈跳與陰影特效 */
    .comic-card {
      box-shadow: 0 10px 25px -4px rgba(220, 38, 38, 0.15), 0 6px 12px -2px rgba(180, 83, 9, 0.1);
    }
    .comic-btn-shadow {
      box-shadow: 0 6px 0 #991b1b, 0 10px 15px -3px rgba(220, 38, 38, 0.4);
    }
    .comic-btn-shadow:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #991b1b, 0 5px 8px -2px rgba(220, 38, 38, 0.4);
    }
    .comic-btn-shadow:disabled {
      transform: none;
      box-shadow: none;
    }
  </style>
</head>
<body class="text-amber-950 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 selection:bg-amber-200 selection:text-red-700">

  <!-- 主容器卡片 -->
  <main class="w-full max-w-md bg-white rounded-3xl comic-card border-4 border-amber-300 overflow-hidden transition-all duration-300 my-4">
    
    <!-- 頂部 Header Banner (完整顯示橫式貼圖，不切角) -->
    <header class="relative bg-amber-100/70 border-b-4 border-amber-300 overflow-hidden">
      <!-- 麵包超人主題貼圖 (保持原始比例完整橫向展示，無裁切) -->
      <div class="w-full bg-[#fceecf] flex items-center justify-center overflow-hidden">
        <img 
          id="bannerImg"
          src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 768' width='100%' height='100%'><defs><linearGradient id='bgGrad' x1='0' y1='0' x2='0' y2='1'><stop offset='0%25' stop-color='%23FFF8E7'/><stop offset='60%25' stop-color='%23FEDEA9'/><stop offset='100%25' stop-color='%23FBC97A'/></linearGradient><pattern id='grid' width='40' height='40' patternUnits='userSpaceOnUse'><path d='M 40 0 L 0 0 0 40' fill='none' stroke='%23F4B266' stroke-width='1.2' opacity='0.35'/></pattern><filter id='popShadow' x='-10%25' y='-10%25' width='120%25' height='120%25'><feDropShadow dx='0' dy='6' stdDeviation='5' flood-color='%239A3412' flood-opacity='0.25'/></filter></defs><rect width='1024' height='768' fill='url(%23bgGrad)'/><rect width='1024' height='768' fill='url(%23grid)'/><path d='M-10,70 Q200,120 400,60 T800,110 T1040,70' fill='none' stroke='%23C2410C' stroke-width='4' stroke-dasharray='10 6'/><g transform='translate(50,50)'><polygon points='0,15 35,60 70,15' fill='%23EF4444' stroke='%237C2D12' stroke-width='4'/><polygon points='80,20 115,65 150,20' fill='%23F59E0B' stroke='%237C2D12' stroke-width='4'/><polygon points='160,25 195,70 230,25' fill='%2310B981' stroke='%237C2D12' stroke-width='4'/></g><g transform='translate(750,50)'><polygon points='0,25 35,70 70,25' fill='%233B82F6' stroke='%237C2D12' stroke-width='4'/><polygon points='80,20 115,65 150,20' fill='%23EF4444' stroke='%237C2D12' stroke-width='4'/><polygon points='160,15 195,60 230,15' fill='%23F59E0B' stroke='%237C2D12' stroke-width='4'/></g><g transform='translate(330, 420)' filter='url(%23popShadow)'><path d='M20,10 C150,5 300,25 450,15 C460,120 450,200 440,250 C300,240 180,265 10,245 C5,160 10,80 20,10 Z' fill='%23FEF3C7' stroke='%2378350F' stroke-width='8'/><path d='M60,210 Q140,80 220,190 Q300,90 380,210' fill='%23A7F3D0' stroke='%23059669' stroke-width='6'/><path d='M90,190 Q170,110 240,195' fill='%2334D399' stroke='%23047857' stroke-width='5'/><path d='M70,160 Q180,180 2 idth='9'/><circle cx='145' cy='160' r='36' fill='%23EF4444' stroke='%237C2D12' stroke-width='8'/><ellipse cx='140' cy='150' rx='9' ry='5' fill='%23FFFFFF'/><circle cx='80' cy='170' r='30' fill='%23FB923C' stroke='%237C2D12' stroke-width='8'/><circle cx='210' cy='170' r='30' fill='%23FB923C' stroke='%237C2D12' stroke-width='8'/><ellipse cx='110' cy='115' rx='10' ry='16' fill='%237C2D12'/><ellipse cx='180' cy='115' rx='10' ry='16' fill='%237C2D12'/><path d='M95,85 Q115,70 135,85' fill='none' stroke='%237C2D12' stroke-width='7' stroke-linecap='round'/><path d='M160,85 Q180,70 200,85' fill='none' stroke='%237C2D12' stroke-width='7' stroke-linecap='round'/><path d='M110,210 Q145,245 180,210' fill='%23991B1B' stroke='%237C2D12' stroke-width='7'/><path d='M120,215 Q145,230 170,215' fill='%23F87171'/><path d='M210,220 Q290,200 310,165' fill='none' stroke='%23EF4444' stroke-width='32' stroke-linecap='round'/><path d='M210,220 Q290,200 310,165' fill='none' stroke='%237C2D12' stroke-width='42' stroke-linecap='round'/><path d='M210,220 Q290,200 310,165' fill='none' stroke='%23EF4444' stroke-width='28' stroke-linecap='round'/><path d='M300,160 L330,140 L345,155 L320,180 Z' fill='%23FACC15' stroke='%237C2D12' stroke-width='8'/><rect x='325' y='135' width='35' height='16' rx='8' fill='%23FACC15' stroke='%237C2D12' stroke-width='7' transform='rotate(-30 330 135)'/><rect x='90' y='360' width='55' height='90' rx='25' fill='%23FACC15' stroke='%237C2D12' stroke-width='8'/><rect x='165' y='360' width='55' height='90' rx='25' fill='%23FACC15' stroke='%237C2D12' stroke-width='8'/></g><g transform='translate(515, 145)' filter='url(%23popShadow)'><path d='M125,5 Q135,-30 145,-45' fill='none' stroke='%237C2D12' stroke-width='10' stroke-linecap='round'/><circle cx='147' cy='-48' r='14' fill='%23F97316' stroke='%237C2D12' stroke-width='7'/><ellipse cx='120' cy='150' rx='85' ry='90' fill='%23FB923C' stroke='%237C2D12' stroke-width='8'/><ellipse cx='85' cy='140' rx='25' ry='38' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='7'/><ellipse cx='155' cy='140' rx='25' ry='38' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='7'/><circle cx='92' cy='145' r='14' fill='%23059669'/><circle cx='148' cy='145' r='14' fill='%23059669'/><circle cx='95' cy='142' r='5' fill='%23FFFFFF'/><circle cx='151' cy='142' r='5' fill='%23FFFFFF'/><path d='M95,190 Q120,215 145,190' fill='%23991B1B' stroke='%237C2D12' stroke-width='6'/><path d='M60,195 L20,160' fill='none' stroke='%237C2D12' stroke-width='18' stroke-linecap='round'/><path d='M60,195 L20,160' fill='none' stroke='%23FB923C' stroke-width='10' stroke-linecap='round'/><line x1='15' y1='110' x2='25' y2='220' stroke='%2378350F' stroke-width='8'/><polygon points='20,120 75,145 22,170' fill='%23EF4444' stroke='%2378350F' stroke-width='6'/></g><g transform='translate(675, 360)' filter='url(%23popShadow)'><path d='M140,40 Q150,-10 160,-35' fill='none' stroke='%237C2D12' stroke-width='12' stroke-linecap='round'/><circle cx='165' cy='-38' r='15' fill='%23374151' stroke='%237C2D12' stroke-width='8'/><path d='M90,40 Q80,-10 70,-35' fill='none' stroke='%237C2D12' stroke-width='12' stroke-linecap='round'/><circle cx='65' cy='-38' r='15' fill='%23374151' stroke='%237C2D12' stroke-width='8'/><ellipse cx='115' cy='135' rx='95' ry='95' fill='%23374151' stroke='%237C2D12' stroke-width='9'/><ellipse cx='115' cy='115' rx='24' ry='22' fill='%23A855F7' stroke='%237C2D12' stroke-width='7'/><ellipse cx='65' cy='95' rx='18' ry='16' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='6'/><ellipse cx='165' cy='95' rx='18' ry='16' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='6'/><circle cx='65' cy='95' r='7' fill='%237C2D12'/><circle cx='165' cy='95' r='7' fill='%237C2D12'/><path d='M45,140 Q115,220 185,140 Z' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='8'/><path d='M65,145 L85,190 L105,145 L125,190 L145,145 L165,190' fill='none' stroke='%237C2D12' stroke-width='6' stroke-linejoin='round'/><g transform='translate(-30, 160)'><rect x='10' y='40' width='80' height='100' rx='18' fill='%236B7280' stroke='%231F2937' stroke-width='7'/><circle cx='50' cy='90' r='28' fill='%23064E3B' stroke='%231F2937' stroke-width='5'/><circle cx='50' cy='90' r='18' fill='none' stroke='%2334D399' stroke-width='3'/><line x1='50' y1='65' x2='50' y2='115' stroke='%2334D399' stroke-width='2'/><line x1='25' y1='90' x2='75' y2='90' stroke='%2334D399' stroke-width='2'/><line x1='50' y1='40' x2='40' y2='0' stroke='%231F2937' stroke-width='6' stroke-linecap='round'/><circle cx='38' cy='-2' r='7' fill='%2338BDF8'/><path d='M25,0 A25,25 0 0,1 55,0' fill='none' stroke='%2338BDF8' stroke-width='5'/></g><path d='M90,340 L85,410 L125,415 L125,345 Z' fill='%23818CF8' stroke='%237C2D12' stroke-width='8'/><path d='M140,340 L145,410 L185,415 L185,345 Z' fill='%23818CF8' stroke='%237C2D12' stroke-width='8'/></g><g transform='translate(450, 620)'><path d='M0,0 Q90,30 200,0' fill='none' stroke='%239A3412' stroke-width='4' stroke-dasharray='8 6'/><polygon points='205,0 185,-8 190,5' fill='%239A3412'/><rect x='-75' y='-22' width='60' height='34' rx='17' fill='%23FFFFFF' stroke='%237C2D12' stroke-width='4'/><text x='-45' y='2' font-family='sans-serif' font-weight='900' font-size='16' fill='%23EA580C' text-anchor='middle'>GO!</text><text x='70' y='30' font-family='Noto Sans TC, Fredoka, sans-serif' font-weight='900' font-size='32' fill='%2378350F'>位、追蹤、回報</text></g></svg>" 
          alt="麵包超人 GPS 定位探索回報" 
          class="w-full h-auto block object-contain aspect-[4/3] max-h-72 sm:max-h-80 transition-all duration-300"
        />
      </div>

      <!-- 標題與活潑副標 -->
      <div class="px-5 py-3 text-center bg-gradient-to-b from-amber-50 to-orange-50/80">
        <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-red-500 text-white text-xs font-bold tracking-wider shadow-sm mb-1">
          <span>✨</span>
          <span>ANPANMAN GPS STATION</span>
          <span>✨</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-black text-red-600 tracking-tight flex items-center justify-center gap-1.5">
          <span>📍</span>
          <span>即時 GPS 位置回報</span>
        </h1>
        <p class="text-xs text-amber-800 font-medium mt-0.5">麵包超人團隊出動！一鍵回傳座標到後端資料庫</p>
      </div>
    </header>

    <div class="p-5 sm:p-6 space-y-4">

      <!-- 裝置 UUID 提示徽章 -->
      <section aria-label="裝置識別" class="bg-amber-50/90 border-2 border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2 min-w-0">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-amber-400 text-white font-bold text-[10px] shrink-0 shadow-inner">ID</span>
          <span class="text-amber-900 font-bold shrink-0">裝置碼:</span>
          <span id="uuidDisplay" class="font-mono text-amber-800 truncate" title="裝置 UUID">載入中...</span>
        </div>
        <button id="copyUuidBtn" type="button" class="px-2.5 py-1 bg-amber-200 hover:bg-amber-300 text-amber-950 font-bold rounded-lg text-xs shrink-0 active:scale-95 transition-all flex items-center gap-1 border border-amber-300" title="複製 UUID">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
          </svg>
          <span>複製</span>
        </button>
      </section>

      <!-- 輸入表單 -->
      <form id="reportForm" class="space-y-4" onsubmit="return false;" novalidate>
        
        <!-- 團隊編號 (必填) -->
        <div>
          <label for="teamCode" class="block text-sm font-bold text-amber-950 mb-1 flex items-center justify-between">
            <span class="flex items-center gap-1">
              <span class="text-red-500">🚩</span> 團隊編號
              <span class="text-red-500 font-bold">*</span>
            </span>
            <span class="text-[11px] font-normal text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">必填欄位</span>
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="teamCode" 
              placeholder="請輸入隊伍代號（例：RED-01）" 
              required
              class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400"
            />
          </div>
          <p id="teamCodeError" class="hidden text-red-600 text-xs mt-1.5 font-bold flex items-center gap-1">
            <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
            </svg>
            請輸入團隊編號以利辨識回報來源！
          </p>
        </div>

        <!-- 姓名 / 暱稱 (選填) -->
        <div>
          <label for="userName" class="block text-sm font-bold text-amber-950 mb-1 flex items-center gap-1">
            <span class="text-amber-600">👤</span> 隊員姓名 / 暱稱
            <span class="text-xs font-normal text-amber-600">(選填)</span>
          </label>
          <input 
            type="text" 
            id="userName" 
            placeholder="請輸入你的名字（例：小超人）" 
            class="w-full px-4 py-2.5 text-amber-950 bg-amber-50/40 border-2 border-amber-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-red-500 focus:bg-white transition-all text-sm font-medium shadow-inner placeholder:text-amber-400"
          />
        </div>

        <!-- 後端 Web App URL (折疊式設定) -->
        <details class="group rounded-2xl border-2 border-amber-200 bg-amber-50/60 p-3 text-xs transition-colors">
          <summary class="font-bold text-amber-900 cursor-pointer flex items-center justify-between select-none">
            <span class="flex items-center gap-1.5">
              <span>⚙️</span>
              後端設定：Google Apps Script API
            </span>
            <svg class="w-3.5 h-3.5 text-amber-600 transform group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </summary>
          <div class="mt-2.5 pt-2 border-t border-amber-200">
            <input 
              type="url" 
              id="apiUrl" 
              placeholder="https://script.google.com/macros/s/.../exec"
              value="https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID_HERE/exec" 
              class="w-full px-3 py-1.5 font-mono text-amber-950 bg-white border border-amber-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 text-xs"
            />
            <p class="text-amber-700 mt-1.5 text-[11px] leading-relaxed">
              請填入 Google Apps Script 部署為 Web 應用程式之 URL（存取權限需設為 Anyone）。
            </p>
          </div>
        </details>

        <!-- 動作按鈕 (麵包超人亮紅 + 鮮黃撞色活力風格) -->
        <button 
          type="button" 
          id="submitBtn" 
          class="w-full py-3.5 px-5 bg-gradient-to-r from-red-500 via-red-600 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white font-black text-base rounded-2xl comic-btn-shadow transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed border-2 border-red-700"
        >
          <!-- 麵包超人風格圓形圖示 -->
          <span id="btnIconEmoji" class="text-xl shrink-0">🍞</span>
          
          <!-- 按鈕 Loading Spinner -->
          <svg id="btnSpinner" class="hidden w-5 h-5 shrink-0 animate-spin-custom text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-30" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>

          <span id="btnText">取得位置並送出</span>
        </button>
      </form>

      <!-- 狀態回饋卡片 (動態顯示) -->
      <section id="statusCard" class="hidden rounded-2xl border-2 p-4 transition-all duration-300" aria-live="polite">
        <div class="flex items-start gap-3">
          <div id="statusIconWrapper" class="shrink-0 text-2xl mt-0.5">
            <!-- Emoji 圖示由 JS 動態注入 -->
          </div>
          <div class="flex-1 min-w-0">
            <h3 id="statusTitle" class="text-sm font-black"></h3>
            <p id="statusDesc" class="text-xs mt-0.5 break-words font-medium"></p>

            <!-- 回報成功的詳細紀錄 (經緯度 / 台北時間) -->
            <div id="reportDetails" class="hidden mt-3 pt-3 border-t border-amber-200/80 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
              <div class="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm">
                <span class="text-amber-700 block text-[11px] font-bold">緯度 (Latitude)</span>
                <span id="detailLat" class="font-mono font-bold text-red-600 text-sm">-</span>
              </div>
              <div class="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm">
                <span class="text-amber-700 block text-[11px] font-bold">經度 (Longitude)</span>
                <span id="detailLng" class="font-mono font-bold text-red-600 text-sm">-</span>
              </div>
              <div class="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm col-span-1 sm:col-span-2">
                <span class="text-amber-700 block text-[11px] font-bold">回報時間 (Asia/Taipei)</span>
                <span id="detailTime" class="font-mono font-bold text-amber-950 text-sm">-</span>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>

    <!-- 頁尾可愛裝飾說明 -->
    <footer class="px-5 py-3 bg-amber-100/60 border-t-2 border-amber-200 text-center text-[11px] text-amber-800 font-medium flex items-center justify-center gap-1.5">
      <span>🍪</span>
      <span>請開啟手機 GPS 與瀏覽器位置存取授權</span>
      <span>🍪</span>
    </footer>
  </main>

  <!-- 浮動 Toast 提示 -->
  <div id="toast" class="fixed bottom-5 bg-amber-900 text-amber-50 px-4 py-2 rounded-xl text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 border border-amber-700 z-50">
    已成功複製！
  </div>

  <script>
    /**
     * GPS 回報前端邏輯模組
     */
    (function () {
      // 快取 DOM 元素
      const teamCodeInput = document.getElementById('teamCode');
      const teamCodeError = document.getElementById('teamCodeError');
      const userNameInput = document.getElementById('userName');
      const apiUrlInput = document.getElementById('apiUrl');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnIconEmoji = document.getElementById('btnIconEmoji');
      const btnSpinner = document.getElementById('btnSpinner');
      const uuidDisplay = document.getElementById('uuidDisplay');
      const copyUuidBtn = document.getElementById('copyUuidBtn');
      const statusCard = document.getElementById('statusCard');
      const statusIconWrapper = document.getElementById('statusIconWrapper');
      const statusTitle = document.getElementById('statusTitle');
      const statusDesc = document.getElementById('statusDesc');
      const reportDetails = document.getElementById('reportDetails');
      const detailLat = document.getElementById('detailLat');
      const detailLng = document.getElementById('detailLng');
      const detailTime = document.getElementById('detailTime');
      const toast = document.getElementById('toast');

      const STORAGE_KEY_UUID = 'gps_reporter_device_uuid';

      /**
       * 1. 取得或產生唯一的裝置 UUID 並儲存
       */
      function initDeviceUUID() {
        let uuid = localStorage.getItem(STORAGE_KEY_UUID);
        if (!uuid) {
          if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
            uuid = crypto.randomUUID();
          } else {
            // 備援方案
            uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
              const r = Math.random() * 16 | 0;
              const v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          }
          localStorage.setItem(STORAGE_KEY_UUID, uuid);
        }
        uuidDisplay.textContent = uuid;
        uuidDisplay.title = uuid;
        return uuid;
      }

      /**
       * 2. 取得 Asia/Taipei 時區格式化時間 (YYYY/MM/DD HH:MM)
       */
      function getTaipeiTimestamp() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('zh-TW', {
          timeZone: 'Asia/Taipei',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });

        const parts = formatter.formatToParts(now);
        const map = {};
        parts.forEach(({ type, value }) => {
          map[type] = value;
        });

        const year = map.year;
        const month = map.month.padStart(2, '0');
        const day = map.day.padStart(2, '0');
        const hour = map.hour.padStart(2, '0');
        const minute = map.minute.padStart(2, '0');

        return `${year}/${month}/${day} ${hour}:${minute}`;
      }

      /**
       * 3. 顯示自訂浮動提示 (Toast)
       */
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        toast.classList.add('opacity-100');
        setTimeout(() => {
          toast.classList.remove('opacity-100');
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2000);
      }

      /**
       * 4. 複製 UUID 到剪貼簿
       */
      copyUuidBtn.addEventListener('click', () => {
        const textToCopy = uuidDisplay.textContent;
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast('✅ 裝置識別碼已複製！');
        } catch (err) {
          showToast('無法複製，請手動複製');
        } finally {
          document.body.removeChild(textarea);
        }
      });

      /**
       * 5. 按鈕讀取中狀態切換
       */
      function setButtonState(isLoading, text = '取得位置並送出', emoji = '🍞') {
        if (isLoading) {
          submitBtn.disabled = true;
          btnSpinner.classList.remove('hidden');
          btnIconEmoji.classList.add('hidden');
          btnText.textContent = text;
        } else {
          submitBtn.disabled = false;
          btnSpinner.classList.add('hidden');
          btnIconEmoji.classList.remove('hidden');
          btnIconEmoji.textContent = emoji;
          btnText.textContent = text;
        }
      }

      /**
       * 6. 狀態卡片展示
       */
      function renderStatus({ type, title, message, details = null }) {
        statusCard.classList.remove('hidden');
        reportDetails.classList.add('hidden');

        // 重設基礎類別
        statusCard.className = 'rounded-2xl border-2 p-4 transition-all duration-300';

        if (type === 'success') {
          statusCard.classList.add('bg-emerald-50/90', 'border-emerald-300', 'text-emerald-950');
          statusIconWrapper.textContent = '🎉';
          if (details) {
            reportDetails.classList.remove('hidden');
            detailLat.textContent = details.latitude;
            detailLng.textContent = details.longitude;
            detailTime.textContent = details.timestamp;
          }
        } else if (type === 'error') {
          statusCard.classList.add('bg-red-50/90', 'border-red-300', 'text-red-950');
          statusIconWrapper.textContent = '⚠️';
        } else if (type === 'info') {
          statusCard.classList.add('bg-amber-50/90', 'border-amber-300', 'text-amber-950');
          statusIconWrapper.textContent = '📡';
        }

        statusTitle.textContent = title;
        statusDesc.textContent = message;
      }

      /**
       * 7. 呼叫瀏覽器 Geolocation API
       */
      function getCurrentCoordinates() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('此瀏覽器不支援 Geolocation 定位功能！'));
            return;
          }

          const options = {
            enableHighAccuracy: true,
            timeout: 12000,
            maximumAge: 0
          };

          navigator.geolocation.getCurrentPosition(
            (position) => resolve(position.coords),
            (err) => {
              let errorMsg = '無法取得位置資訊';
              switch (err.code) {
                case err.PERMISSION_DENIED:
                  errorMsg = '定位權限已被拒絕，請在手機/瀏覽器設定中允許取用位置。';
                  break;
                case err.POSITION_UNAVAILABLE:
                  errorMsg = '無法偵測到位置，請開啟裝置的 GPS 定位服務。';
                  break;
                case err.TIMEOUT:
                  errorMsg = 'GPS 定位超時，請到戶外開闊處重新嘗試。';
                  break;
                default:
                  errorMsg = `定位錯誤：${err.message}`;
              }
              reject(new Error(errorMsg));
            },
            options
          );
        });
      }

      /**
       * 8. 執行回報流程
       */
      async function handleLocationSubmit() {
        const teamCode = teamCodeInput.value.trim();
        if (!teamCode) {
          teamCodeError.classList.remove('hidden');
          teamCodeInput.focus();
          return;
        }
        teamCodeError.classList.add('hidden');

        const userName = userNameInput.value.trim();
        const apiUrl = apiUrlInput.value.trim();
        const uuid = localStorage.getItem(STORAGE_KEY_UUID) || initDeviceUUID();

        if (!apiUrl) {
          renderStatus({
            type: 'error',
            title: '未設定 API 網址',
            message: '請展開上方「後端設定」並輸入有效的 Google Apps Script 部署 URL。'
          });
          return;
        }

        try {
          // 步驟 1: 定位中
          setButtonState(true, 'GPS 搜尋定位中...');
          renderStatus({
            type: 'info',
            title: '正在偵測座標',
            message: '麵包超人衛星正在接收 GPS 訊號，請稍候...'
          });

          const coords = await getCurrentCoordinates();
          const latitude = Number(coords.latitude.toFixed(6));
          const longitude = Number(coords.longitude.toFixed(6));
          const timestamp = getTaipeiTimestamp();

          // 步驟 2: 發送資料
          setButtonState(true, '座標傳送中...');

          const payload = {
            teamCode: teamCode,
            uuid: uuid,
            name: userName,
            latitude: latitude,
            longitude: longitude,
            timestamp: timestamp
          };

          // 以 mode: 'no-cors' 送往 Google Apps Script
          await fetch(apiUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
          });

          // 步驟 3: 回報完成
          setButtonState(false, '再次取得並回報', '✨');
          renderStatus({
            type: 'success',
            title: '回報成功！棒極了！',
            message: '已將你的即時 GPS 座標成功傳送至後端系統記錄。',
            details: {
              latitude: latitude.toFixed(6),
              longitude: longitude.toFixed(6),
              timestamp: timestamp
            }
          });

        } catch (error) {
          console.error('[Report Error]', error);
          setButtonState(false, '重新嘗試回報', '🔄');
          renderStatus({
            type: 'error',
            title: '回報失敗',
            message: error.message || '發生連線錯誤，請確認網路與 GPS 是否正常。'
          });
        }
      }

      // 輸入時隱藏錯誤提示
      teamCodeInput.addEventListener('input', () => {
        if (teamCodeInput.value.trim()) {
          teamCodeError.classList.add('hidden');
        }
      });

      // 監聽按鈕點擊
      submitBtn.addEventListener('click', handleLocationSubmit);

      // 初始化裝置識別碼
      initDeviceUUID();
    })();

    /**
     * 圖片自動相容與備援載入機制
     */
    function handleImageFallback(imgElement) {
      const fallbackList = [
        'image_621e2a.jpg',
        'watermarked_img_2195200632582930229.jpg',
        'input_file_0.png'
      ];
      
      const currentSrc = imgElement.getAttribute('src');
      const nextIndex = fallbackList.indexOf(currentSrc) + 1;

      if (nextIndex > 0 && nextIndex < fallbackList.length) {
        imgElement.src = fallbackList[nextIndex];
      } else if (nextIndex === 0 && fallbackList.length > 0) {
        imgElement.src = fallbackList[0];
      } else {
        // 若皆找不到，改以美觀的麵包超人卡通 SVG 佔位橫幅展示，避免純色方塊
        imgElement.onerror = null;
        imgElement.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="%23FEF3C7"><rect width="800" height="600" fill="%23FEF3C7"/><circle cx="400" cy="270" r="160" fill="%23FFD166" stroke="%234E3629" stroke-width="12"/><circle cx="400" cy="270" r="50" fill="%23EF476F" stroke="%234E3629" stroke-width="10"/><circle cx="310" cy="270" r="38" fill="%23F78C6C" stroke="%234E3629" stroke-width="10"/><circle cx="490" cy="270" r="38" fill="%23F78C6C" stroke="%234E3629" stroke-width="10"/><circle cx="350" cy="200" r="14" fill="%234E3629"/><circle cx="450" cy="200" r="14" fill="%234E3629"/><path d="M 330 330 Q 400 390 470 330" fill="none" stroke="%234E3629" stroke-width="12" stroke-linecap="round"/><text x="400" y="510" font-size="44" font-weight="bold" fill="%23B45309" text-anchor="middle" font-family="sans-serif">GPS 定位回報站</text></svg>';
      }
    }
  </script>
</body>
</html>
